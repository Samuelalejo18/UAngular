<h1 class="text-center text-warning">{{title1}}</h1>
<div class="container mt-5">

    <div class="d-flex justify-content-center">
        <div class="w-15">
            <div class="mb-3 d-flex align-items-center">
                <label for="operandoA" class="form-label me-2 text-nowrap">Operando A</label>
                <input type="number" id="operandoA" [(ngModel)]="operando1" class="form-control text-center" />
            </div>
            <div class="mb-3 d-flex align-items-center">
                <label for="operandoB" class="form-label me-2 text-nowrap">Operando B</label>
                <input type="number" id="operandoB" [(ngModel)]="operando2" class="form-control text-center" />
            </div>
            <button class="btn btn-primary mb-3 w-100" (click)="sumar()">Sumar</button>
            <p class="text-center">Resultado: {{resultado}} </p>
        </div>
    </div>
</div>


<h1 class="text-center text-warning">{{title2}}</h1>

<div class="container mt-5">

    <div class="d-flex justify-content-center">
        <div class="w-15">
            <div class="mb-3 d-flex align-items-center">
                <label for="operandoA" class="form-label me-2 text-nowrap">Operando A</label>
                <input type="number" id="operandoA1" (input)="tomarOperando1($event)"
                    class="form-control text-center" />
            </div>
            <div class="mb-3 d-flex align-items-center">
                <label for="operandoB" class="form-label me-2 text-nowrap">Operando B</label>
                <input type="number" id="operandoB1" (input)="tomarOperando2($event)"
                    class="form-control text-center" />
            </div>
            <button class="btn btn-primary mb-3 w-100" (click)="sumar2()">Sumar</button>
            <p class="text-center">Resultado: {{resultado1}} </p>
        </div>
    </div>
</div>
