<h2 class="text-center text-warning">{{title}}</h2>
<h3 class="text-center text-info">{{texto}}</h3>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 mb-3 d-flex flex-column align-items-center">
            <label for="inputTexto" class="mb-2">Escribe algo: </label>
            <input id="inputTexto" type="text" class="form-control form-control-sm w-50" (input)="actualizarTexto($event)" />
        </div>
        <div class="col-12 mb-3 d-flex flex-column align-items-center">
            <label for="replicarTexto" class="mb-2">Texto Replicado</label>
            <input id="replicarTexto" type="text" class="form-control form-control-sm w-50" [value]="mensaje" readonly />
        </div>
    </div>
</div>
